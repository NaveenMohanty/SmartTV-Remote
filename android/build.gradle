buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.3.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def autolinkDir = file("${rootDir}/build/generated/autolinking")
def autolinkFile = file("${autolinkDir}/autolinking.json")
if (!autolinkFile.exists()) {
    autolinkDir.mkdirs()
    autolinkFile.text = '{"reactNativeVersion":"0.76.1","dependencies":{},"project":{"android":{"sourceDir":"' + rootDir.absolutePath + '","appName":"app","packageName":"com.androidtvremote"}}}'
}

